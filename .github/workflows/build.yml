name: Build and upload to PyPI

on:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.name }} / ${{ matrix.tag }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        # Manually maintained list of oneTBB releases to package.
        # To add a release, add its tag to every platform below.
        include:
          # ---------- linux (glibc, manylinux_2_28) ----------
          - { name: linux-intel, runs-on: ubuntu-latest, tag: v2023.1.0 }
          - { name: linux-intel, runs-on: ubuntu-latest, tag: v2022.3.0 }
          - { name: linux-intel, runs-on: ubuntu-latest, tag: v2022.2.0 }
          - { name: linux-intel, runs-on: ubuntu-latest, tag: v2022.1.0 }
          - { name: linux-intel, runs-on: ubuntu-latest, tag: v2021.13.3 }
          - { name: linux-arm, runs-on: ubuntu-24.04-arm, tag: v2023.1.0 }
          - { name: linux-arm, runs-on: ubuntu-24.04-arm, tag: v2022.3.0 }
          - { name: linux-arm, runs-on: ubuntu-24.04-arm, tag: v2022.2.0 }
          - { name: linux-arm, runs-on: ubuntu-24.04-arm, tag: v2022.1.0 }
          - { name: linux-arm, runs-on: ubuntu-24.04-arm, tag: v2021.13.3 }
          # ---------- linux (musl, musllinux_1_2) ----------
          - { name: musl-linux-intel, runs-on: ubuntu-latest, tag: v2023.1.0 }
          - { name: musl-linux-intel, runs-on: ubuntu-latest, tag: v2022.3.0 }
          - { name: musl-linux-intel, runs-on: ubuntu-latest, tag: v2022.2.0 }
          - { name: musl-linux-intel, runs-on: ubuntu-latest, tag: v2022.1.0 }
          - { name: musl-linux-intel, runs-on: ubuntu-latest, tag: v2021.13.3 }
          - { name: musl-linux-arm, runs-on: ubuntu-24.04-arm, tag: v2023.1.0 }
          - { name: musl-linux-arm, runs-on: ubuntu-24.04-arm, tag: v2022.3.0 }
          - { name: musl-linux-arm, runs-on: ubuntu-24.04-arm, tag: v2022.2.0 }
          - { name: musl-linux-arm, runs-on: ubuntu-24.04-arm, tag: v2022.1.0 }
          - { name: musl-linux-arm, runs-on: ubuntu-24.04-arm, tag: v2021.13.3 }
          # ---------- windows ----------
          - { name: windows-intel, runs-on: windows-latest, tag: v2023.1.0 }
          - { name: windows-intel, runs-on: windows-latest, tag: v2022.3.0 }
          - { name: windows-intel, runs-on: windows-latest, tag: v2022.2.0 }
          - { name: windows-intel, runs-on: windows-latest, tag: v2022.1.0 }
          - { name: windows-intel, runs-on: windows-latest, tag: v2021.13.3 }
          - { name: windows-arm, runs-on: windows-11-arm, tag: v2023.1.0 }
          - { name: windows-arm, runs-on: windows-11-arm, tag: v2022.3.0 }
          - { name: windows-arm, runs-on: windows-11-arm, tag: v2022.2.0 }
          - { name: windows-arm, runs-on: windows-11-arm, tag: v2022.1.0 }
          # oneTBB's Windows on ARM64 support is recent; drop this entry
          # if the v2021.13.3 build turns out not to work there.
          - { name: windows-arm, runs-on: windows-11-arm, tag: v2021.13.3 }
          # ---------- macos ----------
          - { name: macos-intel, runs-on: macos-15-intel, macos-target: "10.15", tag: v2023.1.0 } # macos-15-intel is the last x86_64 runner
          - { name: macos-intel, runs-on: macos-15-intel, macos-target: "10.15", tag: v2022.3.0 }
          - { name: macos-intel, runs-on: macos-15-intel, macos-target: "10.15", tag: v2022.2.0 }
          - { name: macos-intel, runs-on: macos-15-intel, macos-target: "10.15", tag: v2022.1.0 }
          - { name: macos-intel, runs-on: macos-15-intel, macos-target: "10.15", tag: v2021.13.3 }
          - { name: macos-arm, runs-on: macos-latest, macos-target: "11.0", tag: v2023.1.0 } # macos-14+ (including latest) are ARM64 runners
          - { name: macos-arm, runs-on: macos-latest, macos-target: "11.0", tag: v2022.3.0 }
          - { name: macos-arm, runs-on: macos-latest, macos-target: "11.0", tag: v2022.2.0 }
          - { name: macos-arm, runs-on: macos-latest, macos-target: "11.0", tag: v2022.1.0 }
          - { name: macos-arm, runs-on: macos-latest, macos-target: "11.0", tag: v2021.13.3 }

    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-target || '11.0' }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Clone oneTBB
        uses: actions/checkout@v6
        with:
          repository: uxlfoundation/oneTBB
          ref: ${{ matrix.tag }}
          path: oneTBB  # inside the package dir; the CMake shim finds it there
          persist-credentials: false

      - name: Derive package version from tag
        id: version
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ matrix.tag }}

      # One wheel per CPython version (cp3??-* skips free-threaded builds).
      # On Linux cibuildwheel runs auditwheel (retagging to manylinux/musllinux); the
      # Windows/macOS libraries load by explicit path via ctypes, so no
      # repair is needed there.
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ contains(matrix.name, 'musl') && 'cp3??-musllinux_*' || startsWith(matrix.name, 'linux') && 'cp3??-manylinux_*' || 'cp3??-*' }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
          CIBW_MUSLLINUX_AARCH64_IMAGE: musllinux_1_2
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""
          CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_TBB4U
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_TBB4U: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}-${{ matrix.tag }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution (${{ matrix.tag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the tags in build_wheels above.
        tag: [v2023.1.0, v2022.3.0, v2022.2.0, v2022.1.0, v2021.13.3]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Derive package version from tag
        id: version
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ matrix.tag }}

      - name: Build SDist
        run: pipx run build --sdist
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_TBB4U: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: sdists-${{ matrix.tag }}
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          # Wheel artifacts are merged directly into dist/.
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download SDists
        uses: actions/download-artifact@v5
        with:
          # SDist artifacts are merged directly into dist/.
          pattern: sdists-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        # To test uploads to TestPyPI, uncomment the following:
        # with:
        #   repository-url: https://test.pypi.org/legacy/
        with:
          skip-existing: true
